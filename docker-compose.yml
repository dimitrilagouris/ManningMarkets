version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - ./.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: >
      sh -c "
        if [ ! -f db.sqlite3 ]; then
          echo 'Database not found. Initialising...' &&
          python manage.py makemigrations &&
          python manage.py migrate;
        else
          echo 'Database found. Applying any pending migrations...' &&
          python manage.py makemigrations &&
          python manage.py migrate;
        fi &&
        daphne -b 0.0.0.0 -p 8000 djangoProject.asgi:application"

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm start"

volumes:
  redis_data: